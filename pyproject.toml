[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trm-engine"
version = "0.1.0"
description = "Machine-readable, source-cited Technical Reference Manual (TRM) calculation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/trm_engine"]

# The authoritative reference data lives at the repository root (trm/), as
# specified in docs/architecture.md section 3. It is copied into the wheel so an
# installed package can locate its YAML definitions without a repository checkout.
[tool.hatch.build.targets.wheel.force-include]
"trm" = "trm_engine/data/trm"

[tool.hatch.build.targets.sdist]
include = ["src/trm_engine", "trm", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
